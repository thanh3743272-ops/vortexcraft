name: Build Mod
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
      - name: Download Forge MDK
        run: curl -L -o forge-mdk.zip https://maven.minecraftforge.net/net/minecraftforge/forge/1.16.5-36.2.34/forge-1.16.5-36.2.34-mdk.zip
      - name: Set up project folder from MDK
        run: |
          mkdir -p vortexcraft
          unzip -o forge-mdk.zip -d vortexcraft
      - name: Merge mod source into the MDK
        run: |
          mkdir -p mycode
          unzip -o stalkerhorror-mod-src.zip -d mycode
          cp -rf mycode/stalkerhorror/. vortexcraft/
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'
      - name: Build
        run: cd vortexcraft && chmod +x gradlew && ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vortexcraft-jar
          path: vortexcraft/build/libs/*.jar
