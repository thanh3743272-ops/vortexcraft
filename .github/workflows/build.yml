name: Build Mod
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '8'
      - run: unzip -o "vortexcraft-forge-1.16.5.zip"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '7.5.1'
      - run: cd vortexcraft && gradle build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: vortexcraft-jar
          path: vortexcraft/build/libs/*.jar
